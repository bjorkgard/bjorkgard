<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="900" height="3" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" y="2" fill="black" opacity="0.12"/>
    </pattern>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0d0208" stop-opacity="1"/>
      <stop offset="1"   stop-color="#0d0208" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0d0208" stop-opacity="0"/>
      <stop offset="1"   stop-color="#0d0208" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="cp"><rect width="900" height="130"/></clipPath>
  </defs>

  <rect width="900" height="130" fill="#0d0208"/>

  <style>
    .m{font-family:'Courier New',monospace;font-size:13px;font-weight:bold}
    @keyframes f{from{transform:translateY(-117px)}to{transform:translateY(130px)}}
    .c0 {animation:f 1.2s linear infinite 0.00s}
    .c1 {animation:f 1.5s linear infinite 0.30s}
    .c2 {animation:f 1.8s linear infinite 0.70s}
    .c3 {animation:f 2.1s linear infinite 0.10s}
    .c4 {animation:f 1.4s linear infinite 0.90s}
    .c5 {animation:f 2.4s linear infinite 0.50s}
    .c6 {animation:f 1.7s linear infinite 1.20s}
    .c7 {animation:f 2.0s linear infinite 0.40s}
    .c8 {animation:f 1.3s linear infinite 1.60s}
    .c9 {animation:f 2.7s linear infinite 0.20s}
    .c10{animation:f 1.6s linear infinite 0.80s}
    .c11{animation:f 2.2s linear infinite 1.40s}
    .c12{animation:f 1.9s linear infinite 0.60s}
    .c13{animation:f 1.4s linear infinite 1.00s}
    .c14{animation:f 2.5s linear infinite 0.30s}
    .c15{animation:f 1.1s linear infinite 1.70s}
    .c16{animation:f 2.3s linear infinite 0.10s}
    .c17{animation:f 1.8s linear infinite 1.30s}
  </style>

